<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Appointment Booking</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 100%; max-width: 520px; }
        h1 { margin: 0 0 18px; color: #333; text-align: center; }

        .alert { padding: 15px; margin-bottom: 20px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .auth-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .auth-bar button { width: auto; padding: 8px 14px; font-size: 13px; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #555; font-weight: 600; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }

        #card-element { padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }

        .deposit-card { background: #eef6ff; border-left: 4px solid #0066cc; padding: 12px; margin-bottom: 20px; border-radius: 4px; }
        .deposit-card p { margin: 0; font-size: 13px; color: #004085; }

        button { width: 100%; background: #0066cc; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0052a3; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .small { font-size: 12px; color: #666; margin-top: 6px; }
        fieldset { border: none; padding: 0; margin: 0; }
        fieldset:disabled { opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <h1>Book Your Appointment</h1>

    <div class="auth-bar">
        <span id="authStatus" class="small">Checking login status…</span>
        <button id="authBtn" type="button">Log in</button>
    </div>

    <div id="alertBanner" class="alert" role="status" aria-live="polite"></div>

    <form id="bookingForm">
        <fieldset id="formFieldset" disabled>
            <div class="form-group">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" required placeholder="Customer Name">
            </div>

            <div class="form-group">
                <label for="stylistId">Select Stylist</label>
                <select id="stylistId" required>
                    <option value="">-- Choose a Stylist --</option>
                    <option value="stylist-101">Alex (Haircuts & Styling)</option>
                    <option value="stylist-102">Sam (Coloring Specialist)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="bookingDate">Date</label>
                <input type="date" id="bookingDate" required>
            </div>

            <div class="form-group">
                <label for="timeSlot">Available Time Slots</label>
                <select id="timeSlot" required>
                    <option value="">-- Choose stylist and date first --</option>
                </select>
                <div class="small" id="availabilityStatus"></div>
            </div>

            <div class="deposit-card">
                <strong>Deposit Required: $10.00</strong>
                <p>A deposit is required to hold your slot. It is only charged once your booking is confirmed —
                   if someone else books the same slot first, the hold is automatically released.</p>
            </div>

            <div class="form-group">
                <label for="card-element">Card Details</label>
                <div id="card-element"></div>
            </div>

            <button type="submit" id="submitBtn">Pay Deposit &amp; Confirm Booking</button>
        </fieldset>
    </form>
</div>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.1/auth0-spa-js.production.js"></script>
<script src="https://js.stripe.com/v3/"></script>
<script>
    // ---- Configuration — replace with your actual values ----
    const API_BASE_URL = "https://rabpq97yc9.execute-api.us-east-1.amazonaws.com"; // HttpApi $default stage: no /prod suffix
    const STRIPE_PUBLISHABLE_KEY = "pk_test_51Tu3EHRzghb31V6ncCv7z31i8iTL2yXyCbl3cPwfuWiIR9yiee1hF68D72jiHmvkj751EUboLMW2mt1MS8hQyMlg00CujlA6iD";
    const AUTH0_DOMAIN = "dev-bycoupho2ffes63s.us.auth0.com";
    const AUTH0_CLIENT_ID = "LO1kC0II5ZGEPiBwlNkttnHZXlLUmBZv";
    const AUTH0_AUDIENCE = "https://salon-booking-api";

    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);
    const elements = stripe.elements();
    const card = elements.create("card");
    card.mount("#card-element");

    const form = document.getElementById("bookingForm");
    const formFieldset = document.getElementById("formFieldset");
    const alertBanner = document.getElementById("alertBanner");
    const submitBtn = document.getElementById("submitBtn");
    const authBtn = document.getElementById("authBtn");
    const authStatus = document.getElementById("authStatus");
    const stylistSelect = document.getElementById("stylistId");
    const dateInput = document.getElementById("bookingDate");
    const timeSlotSelect = document.getElementById("timeSlot");
    const availabilityStatus = document.getElementById("availabilityStatus");
    
    // Block past dates in the date picker — computed client-side so it's always "today"
    // regardless of when the page was last deployed/cached.
    (function setBookingDates() {
        

    const today = new Date();
    // const yyyy = today.getFullYear();
    // const mm = String(today.getMonth() + 1).padStart(2, "0");
    // const dd = String(today.getDate()).padStart(2, "0");

    dateInput.min = today.toISOString().split("T")[0];
    // dateInput.removeAttribute("max");

    })();

    let auth0Client = null;

    function showAlert(message, isSuccess = true) {
        alertBanner.innerHTML = `<pre style="margin:0;white-space:pre-wrap;font-family:inherit;">${message}</pre>`;
        alertBanner.className = `alert ${isSuccess ? "alert-success" : "alert-error"}`;
        alertBanner.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearAlert() {
        alertBanner.style.display = "none";
        alertBanner.innerHTML = "";
    }

    async function postJson(url, body, token) {
        const resp = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                ...(token ? { Authorization: `Bearer ${token}` } : {}),
            },
            body: JSON.stringify(body),
        });
        const data = await resp.json().catch(() => ({}));
        return { status: resp.status, data };
    }

    async function getJson(url, token) {
        const resp = await fetch(url, {
            headers: token ? { Authorization: `Bearer ${token}` } : {},
        });
        const data = await resp.json().catch(() => ({}));
        return { status: resp.status, data };
    }

    // ---- Auth0 setup ----
    async function initAuth() {
        auth0Client = await auth0.createAuth0Client({
            domain: AUTH0_DOMAIN,
            clientId: AUTH0_CLIENT_ID,
            authorizationParams: {
                redirect_uri: window.location.origin,
                audience: AUTH0_AUDIENCE,
            },
        });

        const query = window.location.search;
        if (query.includes("code=") && query.includes("state=")) {
            await auth0Client.handleRedirectCallback();
            window.history.replaceState({}, document.title, "/");
        }
        
        loadAvailability();

        await refreshAuthUI();
    }

    async function refreshAuthUI() {
        const isAuthenticated = await auth0Client.isAuthenticated();
        if (isAuthenticated) {
            const user = await auth0Client.getUser();
            authStatus.textContent = `Logged in as ${user.email || user.name}`;
            authBtn.textContent = "Log out";
            formFieldset.disabled = false;
            loadAvailability();
        } else {
            authStatus.textContent = "Please log in to book an appointment.";
            authBtn.textContent = "Log in";
            formFieldset.disabled = true;
        }
    }

    authBtn.addEventListener("click", async () => {
        const isAuthenticated = await auth0Client.isAuthenticated();
        if (isAuthenticated) {
            await auth0Client.logout({ logoutParams: { returnTo: window.location.origin } });
        } else {
            await auth0Client.loginWithRedirect();
        }
    });

    // ---- Availability ----
    // ------------------------------------------------------------
    // Load available appointment times
    // Prevent duplicate bookings by disabling the submit button
    // until the latest availability has been loaded.
    // ------------------------------------------------------------
        async function loadAvailability() {

        const stylist_id = stylistSelect.value;
        const date = dateInput.value;

        timeSlotSelect.innerHTML =
            `<option value="">-- Choose stylist and date first --</option>`;

        availabilityStatus.textContent = "";

        // Disable booking while checking availability
        submitBtn.disabled = true;

        if (!stylist_id || !date) {

            submitBtn.disabled = false;
            return;

        }

        availabilityStatus.textContent =
            "Checking available appointment times...";

        try {

            const token = await auth0Client.getTokenSilently();

            const { status, data } = await getJson(

                `${API_BASE_URL}/availability?stylist_id=${encodeURIComponent(stylist_id)}&date=${encodeURIComponent(date)}`,

                token

            );

            if (status !== 200) {

                availabilityStatus.textContent =
                    "Could not load availability. Try again.";

                return;

            }

            const slots = data.available_slots || [];

            if (slots.length === 0) {

                timeSlotSelect.innerHTML =
                    `<option value="">No appointments available this day</option>`;

            } else {

                timeSlotSelect.innerHTML =
                    `<option value="">-- Select Time Slot --</option>` +
                    slots.map(slot =>
                        `<option value="${slot}">${slot}</option>`
                    ).join("");

            }

            availabilityStatus.textContent = "";

        }

        catch (err) {

            console.error(err);

            availabilityStatus.textContent =
                "Could not load availability. Try again.";

        }

        finally {

            // Always re-enable the button once loading finishes
            submitBtn.disabled = false;

        }

    }
    stylistSelect.addEventListener("change", loadAvailability);
    dateInput.addEventListener("change", loadAvailability);
    
     // ---- Poll /status after a 202, since "queued" isn't the final answer —
    // the Worker Lambda resolves duplicate-slot races asynchronously. Poll a
    // few times with a short delay rather than trusting the 202 at face value.
       async function pollBookingStatus(paymentIntentId, token, { attempts = 8, delayMs = 1500 } = {}) {
        for (let i = 0; i < attempts; i++) {
            await new Promise((resolve) => setTimeout(resolve, delayMs));
            try {
                const { status, data } = await getJson(
                    `${API_BASE_URL}/status?payment_intent_id=${encodeURIComponent(paymentIntentId)}`,
                    token
                );
                if (status === 200 && data.booking_status && data.booking_status !== "pending") {
                    return data.booking_status; // "confirmed" or "duplicate_slot_taken"
                }
            } catch (err) {
                console.error("Status poll failed:", err);
                // keep retrying — a single failed poll shouldn't abort the whole flow
            }
        }
        return "timeout"; // gave up waiting; still genuinely unresolved
    }

    // ---- Booking submission ----
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearAlert();
        submitBtn.disabled = true;
        submitBtn.textContent = "Processing…";

        const customer_name = document.getElementById("customerName").value.trim();
        const stylist_id = stylistSelect.value;
        const date = dateInput.value;
        const time_slot = timeSlotSelect.value;

        if (!customer_name || !stylist_id || !date || !time_slot) {
            showAlert("Please complete all required fields.", false);
            submitBtn.disabled = false;
            submitBtn.textContent = "Pay Deposit & Confirm Booking";
            return;
        }

        try {
            const token = await auth0Client.getTokenSilently();

            const { error: pmError, paymentMethod } = await stripe.createPaymentMethod({
                type: "card",
                card: card,
                billing_details: { name: customer_name },
            });

            if (pmError) {
                showAlert(pmError.message || "Failed to create payment method.", false);
                submitBtn.disabled = false;
                submitBtn.textContent = "Pay Deposit & Confirm Booking";
                return;
            }

            const stylist_name = stylistSelect.options[stylistSelect.selectedIndex].text.split("(")[0].trim();
            const payload = {
                customer_name,
                stylist_id,
                stylist_name,
                date,
                time_slot,
                payment_method_id: paymentMethod.id,
                client_request_id: `${stylist_id}-${date}-${time_slot}-${Date.now()}`,
            };

            // Note: no trailing "/book" duplication — API_BASE_URL is the API root.
            const resp = await postJson(`${API_BASE_URL}/book`, payload, token);

            if (resp.status === 200 && resp.data && resp.data.client_secret) {
                const clientSecret = resp.data.client_secret;
                const { error: confirmError } = await stripe.confirmCardPayment(clientSecret);
                if (confirmError) {
                    showAlert(confirmError.message || "Payment confirmation failed.", false);
                    submitBtnq.disabled = false;
                    submitBtn.textContent = "Pay Deposit & Confirm Booking";
                    return;

                }
                // fall through to polling below using the same payment_intent_id
                resp.data.payment_intent_id = resp.data.payment_intent_id || clientSecret.split("_secret")[0];

            }
            if (resp.status === 200 || resp.status === 202) {
                const paymentIntentId = resp.data.payment_intent_id;
                const [year, month, day] = date.split("-").map(Number);
                const formattedDate = new Date(year, month - 1, day).toLocaleDateString("en-US", {
                    weekday: "long", year: "numeric", month: "long", day: "numeric",
                });
 
                showAlert(
                    `⏳ Confirming your booking…\n\n${stylist_name} — ${formattedDate} at ${time_slot}\n\nPlease wait a moment while we finalize your slot.`,
                    true, /* isSuccess */ true /* pending */
                );
 
                const outcome = paymentIntentId
                    ? await pollBookingStatus(paymentIntentId, token)
                    : "timeout";
 
                if (outcome === "confirmed") {
                    const bookingRef = resp.data.booking_reference || payload.client_request_id;
                    showAlert(
                        `🎉 Booking Confirmed!\n\nThank you, ${customer_name}.\n\n👤 Stylist: ${stylist_name}\n📅 Date: ${formattedDate}\n🕘 Time: ${time_slot}\n📖 Reference: ${bookingRef}\n\nYour $10 deposit has been charged. We look forward to seeing you!`,
                        true
                    );
                    form.reset();
                    card.clear();
                    loadAvailability();
                } else if (outcome === "duplicate_slot_taken") {
                    showAlert(
                        `😔 Sorry — that time slot was just booked by someone else moments before you.\n\nYour $10 deposit hold has been released; you will not be charged.\n\nPlease pick another available time.`,
                        false
                    );
                    loadAvailability();
                } else {
                    // timeout — genuinely unresolved after polling; be honest about it
                    showAlert(
                        `Your booking request was received and is still being processed. This is taking longer than usual — please check back in a minute, or contact the salon with reference ${resp.data.booking_reference || payload.client_request_id} if you don't hear back.`,
                        true
                    );
                }
            } else if (resp.status === 401) {
                showAlert("Your session expired. Please log in again.", false);
            } else if (resp.status === 402) {
                showAlert(resp.data?.error || "Payment required or failed.", false);
            } else {
                showAlert(resp.data?.error || "Unexpected error. Please try again.", false);
            }
        } catch (err) {
            console.error("Submission error:", err);
            showAlert("Network error: unable to reach the booking server.", false);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Pay Deposit & Confirm Booking";
        }
    });
 
    initAuth();         
</script>
</body>
</html>
