name: Deploy Salon Booking system to AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write 
  contents: read  
jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: pip install -r requirements.txt


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run unit tests
        run: |
          if [ -d tests ]; then pytest; else echo "No tests directory found, skipping"; fi

      - name: Get AWS account ID
        id: aws_account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: CDK bootstrap (safe to run every time — no-ops if already bootstrapped)
        run: npx aws-cdk@2 bootstrap aws://${{ secrets.AWS_ACCOUNT_ID }}/${{ env.AWS_REGION }}

      - name: CDK deploy
        run: |
          npx aws-cdk@2 deploy --all --require-approval never \
            -c auth0_domain="${{ secrets.AUTH0_DOMAIN }}" \
            -c auth0_audience="${{ secrets.AUTH0_AUDIENCE }}"
        env:
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
 
      - name: Get frontend bucket name from stack outputs
        id: stack_outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name SalonBookingStack \
            --query "Stacks[0].Outputs[?OutputKey=='SalonFrontendBucketName'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
 
      - name: Sync frontend to S3
        run: |
          aws s3 sync ./frontend s3://${{ steps.stack_outputs.outputs.bucket }} --delete