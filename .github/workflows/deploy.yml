name: Deploy CDK Stack to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          npm install -g aws-cdk
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy CDK Stack
        run: |
          cdk synth
          cdk deploy --require-approval never --outputs-file outputs.json

      - name: Deploy Frontend to S3
        run: |
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?contains(Name, 'salonfrontendbucket')].Name" --output text | head -n 1)

          if [ -z "$BUCKET_NAME" ] && [ -f outputs.json ]; then
            BUCKET_NAME=$(grep -o '"SalonFrontendBucketName": "[^"]*"' outputs.json | cut -d'"' -f4)   
          fi
          echo "Target Bucket: $BUCKET_NAME"
          
          if [ -n "$BUCKET_NAME" ]; then
           
             aws s3 sync ./frontend s3://$BUCKET_NAME/ --delete
             echo "Successfully deployed frontend to s3://$BUCKET_NAME/"
          else
            echo "ERROR: Could not locate frontend S3 bucket"
            exit 1
          fi